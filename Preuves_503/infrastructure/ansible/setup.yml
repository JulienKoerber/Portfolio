---
- name: Setup Kubernetes Cluster (Master + 2 Workers)
  hosts: all
  become: yes
  vars:
    k8s_version: "1.28"
    # Liste des services à construire
    microservices:
      - { name: "commandes-api", path: "/vagrant/api/commandes-api" }
      - { name: "catalogue-api", path: "/vagrant/api/catalogue-api" }
      - { name: "client-api",    path: "/vagrant/api/client-api" }
      - { name: "panier-api",    path: "/vagrant/api/panier-api" }
      - { name: "frontend",      path: "/vagrant/frontend" }

  tasks:
    # ==============================================================================
    # 1. PRÉPARATION SYSTÈME (SUR TOUS LES NOEUDS)
    # ==============================================================================
    - name: Configuration Système (Swap, Kernel, Sysctl)
      block:
        - name: Désactiver le swap
          command: swapoff -a
          when: ansible_swaptotal_mb > 0

        - name: Commenter le swap dans fstab
          replace:
            path: /etc/fstab
            regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
            replace: '# \1'

        - name: Charger modules et sysctl
          shell: |
            modprobe br_netfilter
            cat <<EOF | tee /etc/modules-load.d/k8s.conf
            br_netfilter
            EOF
            cat <<EOF | tee /etc/sysctl.d/k8s.conf
            net.bridge.bridge-nf-call-iptables  = 1
            net.ipv4.ip_forward                 = 1
            net.bridge.bridge-nf-call-ip6tables = 1
            EOF
            sysctl --system

    - name: Installer les dépendances de base (curl, gpg)
      apt:
        name: [apt-transport-https, ca-certificates, curl, gnupg, lsb-release]
        state: present
        update_cache: yes

    - name: Configurer les dépôts (Docker & Kubernetes)
      block:
        - name: Créer dossier keyrings
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: Ajouter clés GPG
          shell: |
            curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg --yes
            curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg --yes

        - name: Ajouter sources lists
          shell: |
            # Detect architecture and write appropriate deb line for docker (amd64 or arm64)
            arch_from_dpkg=$(dpkg --print-architecture 2>/dev/null || true)
            # Fallback to Ansible fact if dpkg not available
            if [ -z "$arch_from_dpkg" ]; then
              arch_from_dpkg="{{ ansible_architecture | default('amd64') }}"
            fi
            case "$arch_from_dpkg" in
              arm64|aarch64)
                docker_arch=arm64
                ;;
              amd64|x86_64)
                docker_arch=amd64
                ;;
              *)
                docker_arch=amd64
                ;;
            esac
            echo "deb [arch=${docker_arch} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable" > /etc/apt/sources.list.d/docker.list
            echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /' > /etc/apt/sources.list.d/kubernetes.list

    - name: Installer le Core (Containerd, Docker, K8s)
      apt:
        name: [containerd.io, kubelet, kubeadm, kubectl, docker-ce, docker-ce-cli]
        state: present
        update_cache: yes

    - name: Bloquer les versions K8s
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]

    # --- CORRECTION ICI : Redémarrage immédiat ---
    - name: Configurer et Redémarrer Containerd
      block:
        - name: Générer config.toml
          shell: |
            containerd config default > /etc/containerd/config.toml
            sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
        
        - name: Redémarrer containerd immédiatement
          service:
            name: containerd
            state: restarted
            enabled: yes

    # ==============================================================================
    # 2. INITIALISATION MASTER (UNIQUEMENT SUR LE MASTER)
    # ==============================================================================
    - name: Setup Master Node
      when: ansible_hostname == 'k8s-master'
      block:
        - name: Reset Cluster (Nettoyage préventif)
          shell: kubeadm reset -f || true
          ignore_errors: yes

        - name: Initialiser Kubeadm
          command: kubeadm init --pod-network-cidr=192.168.0.0/16 --apiserver-advertise-address=192.168.56.10
          register: kubeadm_init

        - name: Configurer .kube pour Vagrant
          shell: |
            mkdir -p /home/vagrant/.kube
            cp -f /etc/kubernetes/admin.conf /home/vagrant/.kube/config
            chown vagrant:vagrant /home/vagrant/.kube/config
            chmod 600 /home/vagrant/.kube/config

        # --- ATTENTE CRITIQUE POUR ÉVITER CONNECTION REFUSED ---
        - name: Attendre que l'API Server soit prêt (Port 6443)
          wait_for:
            host: 192.168.56.10
            port: 6443
            timeout: 120

        - name: Attendre que kubectl réponde
          command: kubectl get nodes
          environment:
            KUBECONFIG: /etc/kubernetes/admin.conf
          register: api_ready
          until: api_ready.rc == 0
          retries: 20
          delay: 5
        # -----------------------------------------------------

        - name: Installer Calico (CNI)
          command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.26.1/manifests/calico.yaml
          environment:
            KUBECONFIG: /etc/kubernetes/admin.conf

        - name: Créer le Token de Join
          shell: kubeadm token create --print-join-command > /vagrant/infrastructure/ansible/join_command.sh

    # ==============================================================================
    # 3. GESTION DES IMAGES (HYBRIDE : BUILD SUR MASTER -> PARTAGE -> IMPORT PARTOUT)
    # ==============================================================================
    - name: Préparer dossier partagé pour images
      file:
        path: /vagrant/infrastructure/images
        state: directory
        mode: '0777'

    # --- ÉTAPE A : LE MASTER CONSTRUIT ET EXPORTE ---
    - name: Build & Export Images (Sur Master)
      when: ansible_hostname == 'k8s-master'
      block:
        # Base Image
        - name: Build Base
          shell: docker build -t base:latest -f /vagrant/infrastructure/docker/base.Dockerfile /vagrant/infrastructure/docker
        - name: Save Base
          shell: docker save base:latest -o /vagrant/infrastructure/images/base.tar

        # Microservices
        - name: Build Apps
          shell: docker build -t {{ item.name }}:latest {{ item.path }}
          loop: "{{ microservices }}"
        
        - name: Save Apps
          shell: docker save {{ item.name }}:latest -o /vagrant/infrastructure/images/{{ item.name }}.tar
          loop: "{{ microservices }}"

    # --- ÉTAPE B : TOUT LE MONDE (MASTER + WORKERS) IMPORTE ---
    - name: Importer les images dans Containerd (Sur tous les noeuds)
      block:
        - name: Import Base
          shell: ctr -n k8s.io images import /vagrant/infrastructure/images/base.tar

        - name: Import Apps
          shell: ctr -n k8s.io images import /vagrant/infrastructure/images/{{ item.name }}.tar
          loop: "{{ microservices }}"

    # ==============================================================================
    # 4. DÉPLOIEMENT APPS (UNIQUEMENT SUR LE MASTER)
    # ==============================================================================
    - name: Appliquer les manifests K8s
      when: ansible_hostname == 'k8s-master'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      shell: |
        kubectl apply -f /vagrant/infrastructure/kubernetes/namespace.yaml
        kubectl apply -f /vagrant/infrastructure/kubernetes/configmap.yaml
        kubectl apply -f /vagrant/infrastructure/kubernetes/secret.yaml
        kubectl apply -f /vagrant/infrastructure/kubernetes/pv-pvc.yaml
        kubectl apply -f /vagrant/infrastructure/kubernetes/db-init-configmap.yaml
        kubectl apply -f /vagrant/infrastructure/kubernetes/catalogue-db.yaml
        kubectl apply -f /vagrant/infrastructure/kubernetes/client-db.yaml
        kubectl apply -f /vagrant/infrastructure/kubernetes/commandes-db.yaml
        kubectl apply -f /vagrant/infrastructure/kubernetes/redis.yaml
        kubectl apply -f /vagrant/infrastructure/kubernetes/catalogue.yaml
        kubectl apply -f /vagrant/infrastructure/kubernetes/client.yaml
        kubectl apply -f /vagrant/infrastructure/kubernetes/panier.yaml
        kubectl apply -f /vagrant/infrastructure/kubernetes/commandes.yaml
        kubectl apply -f /vagrant/infrastructure/kubernetes/frontend-nginx-config.yaml
        kubectl apply -f /vagrant/infrastructure/kubernetes/frontend.yaml
      ignore_errors: yes

    # ==============================================================================
    # 5. JOIN WORKERS (UNIQUEMENT SUR LES SLAVES)
    # ==============================================================================
    - name: Join Workers
      when: "'worker' in ansible_hostname"
      block:
        - name: Reset Worker
          shell: kubeadm reset -f || true
        
        - name: Attendre le token
          wait_for:
            path: /vagrant/infrastructure/ansible/join_command.sh
            timeout: 300

        - name: Lire la commande Join
          command: cat /vagrant/infrastructure/ansible/join_command.sh
          register: join_cmd

        - name: Attendre que le master soit accessible (Port 6443)
          wait_for:
            host: 192.168.56.10
            port: 6443
            timeout: 300

        - name: Exécuter Join
          command: "{{ join_cmd.stdout }}"
          args:
            creates: /etc/kubernetes/kubelet.conf
          register: join_cluster
          until: join_cluster.rc == 0
          retries: 10
          delay: 10

  handlers:
    - name: Restart containerd
      service:
        name: containerd
        state: restarted